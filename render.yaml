services:
  - type: web
    name: alqueen-ticket-bot
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: DASHBOARD_URL
        value: https://alqueen-ticket-bot.onrender.com
      - key: SESSION_SECRET
        generateValue: true
